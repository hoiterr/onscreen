<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarkov Overlay - Minimap</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    .overlay-container {
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #3498db;
      border-radius: 12px;
      padding: 10px;
      backdrop-filter: blur(10px);
    }

    .overlay-header {
      background: rgba(52, 152, 219, 0.8);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-weight: bold;
      text-align: center;
      cursor: move;
      -webkit-app-region: drag;
    }

    .minimap-canvas {
      width: 100%;
      height: calc(100% - 50px);
      background: rgba(20, 20, 20, 0.9);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #95a5a6;
    }

    .position-info {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #3498db;
      padding: 6px;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="overlay-container">
    <div class="overlay-header">
      Tarkov Overlay - Minimap
    </div>
    <div class="minimap-canvas">
      <div id="minimap-content">
        <p>📍 Waiting for position...</p>
        <p style="font-size: 10px; margin-top: 10px;">Press F12 in Tarkov to update</p>
      </div>
    </div>
    <div class="position-info" id="position-info">
      No position data
    </div>
  </div>

  <script>
    // Listen for position updates
    if (window.electronAPI) {
      window.electronAPI.onPositionUpdate((data) => {
        const content = document.getElementById('minimap-content');
        const info = document.getElementById('position-info');

        if (data.coordinates) {
          content.innerHTML = `
            <p style="font-size: 24px;">📍</p>
            <p style="margin-top: 10px;">Map: ${data.map || 'Unknown'}</p>
          `;

          info.textContent = `X: ${data.coordinates.x.toFixed(1)}, Y: ${data.coordinates.y.toFixed(1)}, Z: ${data.coordinates.z.toFixed(1)}`;
        }
      });
    }
  </script>
</body>
</html>
